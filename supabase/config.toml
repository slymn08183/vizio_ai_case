# Supabase local development config.
# Regenerate with `supabase init` if your CLI version expects a different schema;
# the sections that matter for THIS project are [auth.hook.custom_access_token]
# (claim injection) and [db.seed].

project_id = "team-social-mvp"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
# Streamlines the demo (no inbox round-trip). /auth/confirm already handles the
# OTP link if you flip this back on. Documented as a known limitation in README.
enable_confirmations = false

# Google OAuth (PKCE). Fill GOTRUE_EXTERNAL_GOOGLE_* envs or edit here.
[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
redirect_uri = "http://localhost:54321/auth/v1/callback"

# ── Custom Access Token Auth Hook — injects app_metadata.{team_id,onboarded} ──
# This is what makes current_user_team_id() resolve on the FIRST token.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"
